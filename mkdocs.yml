# Docs site for this repository, built with MkDocs and Material for MkDocs.
# Local preview:  pip install -r requirements-docs.txt && mkdocs serve
site_name: DevOps Interview Questions
site_description: DevOps interview questions, notes, diagrams, and labs, organized by topic.
repo_url: https://github.com/SivaKumarMahan/interview-questions
repo_name: interview-questions
edit_uri: edit/main/

# The Markdown lives at the repository root, next to this file.
docs_dir: .
site_dir: site

exclude_docs: |
  .github/
  site/
  overrides/
  node_modules/
  requirements-docs.txt
  cspell.json
  .markdownlint.json
  lychee.toml
  .lycheecache

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - same-dir
  - search

hooks:
  - overrides/hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub-style heading anchors, so in-page links work on GitHub and on the site
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: info
