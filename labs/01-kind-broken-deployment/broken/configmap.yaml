# nginx site configuration. It contains a deliberate bug.
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: lab
data:
  default.conf: |
    server {
        listen 80;
        location / {
            root /usr/share/nginx/html;
            index index.html
        }
        location /healthz {
            return 200 "ok\n";
        }
    }
