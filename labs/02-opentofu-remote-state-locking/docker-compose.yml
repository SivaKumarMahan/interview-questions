services:
  postgres:
    image: postgres:17-alpine
    container_name: lab-pg
    environment:
      POSTGRES_USER: tofu
      POSTGRES_DB: tofu_state
      # Set in .env (copy .env.example). Never commit the real .env file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Only listen on this machine. 15432 avoids a clash with a local PostgreSQL on 5432.
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tofu -d tofu_state"]
      interval: 2s
      timeout: 3s
      retries: 15
