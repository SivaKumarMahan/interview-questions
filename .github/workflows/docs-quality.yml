# Checks every pull request that changes documentation:
#   1. markdownlint - Markdown style and structure (.markdownlint.json)
#   2. lychee       - broken links, internal and external (lychee.toml)
#   3. cspell       - spelling, with a DevOps word list (cspell.json)
name: Docs quality

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".markdownlint.json"
      - "cspell.json"
      - "lychee.toml"
      - ".github/workflows/docs-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: .markdownlint.json
          globs: "**/*.md"

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore link-check cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: lychee-${{ github.sha }}
          restore-keys: lychee-
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress "./**/*.md"
          fail: true

  spelling:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: streetsidesoftware/cspell-action@v9
        with:
          config: cspell.json
          files: "**/*.md"
          incremental_files_only: false
